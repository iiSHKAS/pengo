[package]
name = "pengo"
version = "0.1.1"
description = "Pengo - screenshot capture, library and editor"
edition = "2021"

[lib]
name = "pengo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "5"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
x11rb = { version = "0.13", features = ["randr"] }
zbus = "5"
arboard = "3"
evdev = "0.13.2"
libc = "0.2"

tauri-plugin-updater = "2.12"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Dev builds: optimise dependencies (image resize / PNG encode are painfully slow unoptimised).
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
